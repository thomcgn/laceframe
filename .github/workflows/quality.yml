name: Quality

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Development checks or complete pre-alpha regression'
        type: choice
        required: true
        default: full
        options:
          - dev
          - full

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Unit tests need neither Chromium browsers nor an Electron executable.
      ELECTRON_SKIP_BINARY_DOWNLOAD: ${{ inputs.profile == 'dev' && '1' || '' }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      QUALITY_DIFF_BASE: HEAD
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Desktop dependencies (manual FULL only)
        if: inputs.profile == 'full'
        run: |
          set -euo pipefail
          npx --no-install playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends openbox dbus-x11
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Manual development checks
        if: inputs.profile == 'dev'
        run: npm run check:dev
      - name: Manual FULL regression
        if: inputs.profile == 'full'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' dbus-run-session -- bash -euo pipefail -c '
            openbox > /tmp/laceframe-openbox.log 2>&1 &
            manager=$!
            trap '\''kill "$manager" 2>/dev/null || true'\'' EXIT
            npm run check:full
          '
      - name: Verify completed profile evidence
        env:
          QUALITY_PROFILE: ${{ inputs.profile }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const profile = process.env.QUALITY_PROFILE;
          const report = JSON.parse(fs.readFileSync(`artifacts/quality/${profile}.json`, 'utf8'));
          if (report.status !== 'passed' || report.profile !== profile) throw new Error('Required checks did not complete');
          console.log(`quality-gate passed: ${profile}`);
          NODE
      - name: Upload actual timings and synthetic diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
