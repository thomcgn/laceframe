[package]
name = "laceframe-spritefusion"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
spritefusion-pixel-snapper = { path = "vendor" }
image = { version = "=0.24.9", default-features = false, features = ["png"] }
wasm-bindgen = "=0.2.105"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
